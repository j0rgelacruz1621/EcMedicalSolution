services:
  postgres:
    image: postgres:16-alpine
    container_name: ecmedicalsolution-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecmedical
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: ecmedicalsolution-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecmedical?schema=public
    working_dir: /app
    command: npm run start:dev
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: ecmedicalsolution-frontend
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    working_dir: /app
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_agent
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      - backend

  cloudflare-tunnel-frontend:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_frontend_agent
    restart: always
    command: tunnel --no-autoupdate run --token ${FRONTEND_CLOUDFLARE_TUNNEL_TOKEN:?FRONTEND_CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      - frontend

volumes:
  backend_node_modules:
  frontend_node_modules:
  postgres_data: