services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: ecmedicalsolution-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: development
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  backend_node_modules: